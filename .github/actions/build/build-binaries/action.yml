name: "Build Java Binaries"
description: "Build and test Java binaries using standard Makefile targets"

inputs:
  mainJavaBuild:
    description: "Whether this is the main Java version build (true) or just additional version for tests (false)"
    required: false
    default: "true"
  artifactSuffix:
    description: "Suffix/prefix for the uploaded artifact"
    required: true
  skipTests:
    description: "Skip the test execution step and test result publishing (use when tests run in a separate workflow)"
    required: false
    default: "false"
  clusterOperatorBuild:
    description: "[Deprecated - use skipTests instead] When set to 'true', skips test execution. Makefile target steps are now auto-detected."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    #############################################################
    # Common build steps
    #############################################################
    - name: Restore Maven cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-

    - name: Build binaries
      shell: bash
      run: make java_install
      env:
        MVN_ARGS: '-B -DskipTests'

    #############################################################
    # Optional build targets - each step runs only if the
    # corresponding Makefile target exists in the project
    #############################################################
    - name: Run SpotBugs
      shell: bash
      run: "${{ github.action_path }}/make.sh spotbugs"

    - name: Setup dashboards for Helm Chart
      shell: bash
      run: "${{ github.action_path }}/make.sh dashboard_install"

    - name: Generate YAMLs from Helm Chart
      shell: bash
      run: "${{ github.action_path }}/make.sh helm_install"

    - name: Distribute CRDs
      shell: bash
      run: "${{ github.action_path }}/make.sh crd_install"

    - name: Run Helm Chart unit tests
      shell: bash
      run: "${{ github.action_path }}/make.sh helm_unittest"

    - name: Generate docs version files
      shell: bash
      run: "${{ github.action_path }}/make.sh docu_versions"

    - name: Check docs
      shell: bash
      run: "${{ github.action_path }}/make.sh docu_check"

    - name: Run Shellcheck
      shell: bash
      run: "${{ github.action_path }}/make.sh shellcheck"

    - name: Check released files
      shell: bash
      run: "${{ github.action_path }}/make.sh release_files_check"

    - name: Check for uncommitted files
      shell: bash
      run: "${{ github.action_path }}/check-uncommitted-changes.sh"

    #############################################################
    # Common build steps
    #############################################################
    - name: Run tests and verification
      if: ${{ inputs.skipTests != 'true' && inputs.clusterOperatorBuild != 'true' }}
      shell: bash
      run: |
          make java_install

    - name: Save Maven cache
      # Save maven cache only after pushes into default branch
      if: ${{ inputs.mainJavaBuild == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.m2/repository
        key: maven-${{ hashFiles('**/pom.xml') }}

    - name: Create artifact tarball
      if: ${{ inputs.mainJavaBuild == 'true' }}
      shell: bash
      run: |
        # Archive build artifacts preserving directory structure for multi-module projects
        # Includes:
        #   - All target/ directories (contains JARs, POMs, and other build outputs)
        #   - docker-images/artifacts/binaries (if exists)
        # Excludes:
        #   - Test outputs that aren't needed for deployment

        PATHS_TO_ARCHIVE=$(find . -type d -name "target")
        if [ -d "./docker-images/artifacts/binaries" ]; then
          PATHS_TO_ARCHIVE="$PATHS_TO_ARCHIVE ./docker-images/artifacts/binaries"
        fi

        tar -cvpf binaries-${{ inputs.artifactSuffix }}.tar \
          --exclude='**/surefire-reports' \
          $PATHS_TO_ARCHIVE

    - name: Upload artifact
      if: ${{ inputs.mainJavaBuild == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: binaries-${{ inputs.artifactSuffix }}.tar
        path: binaries-${{ inputs.artifactSuffix }}.tar
        retention-days: 7

    - name: Publish test results
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      if: always() && inputs.skipTests != 'true' && inputs.clusterOperatorBuild != 'true'
      with:
        name: 'Unit & Integration tests'
        path: '**/TEST-*.xml'
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false
