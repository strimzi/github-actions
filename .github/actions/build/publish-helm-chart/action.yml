name: "Publish Helm Chart"
description: "Publishes Helm Chart as OCI artifact to registry"

inputs:
  releaseVersion:
    description: "Release version (e.g., 0.45.0)"
    required: true
  helmChartName:
    description: "Name of the Helm Chart to be published"
    required: true
  artifactSuffix:
    description: "Suffix of archive with images"
    required: true
  containerRegistry:
    description: "Container registry for Helm OCI artifacts (e.g., quay.io, ghcr.io)"
    required: false
    default: "quay.io"
  containerOrg:
    description: "Container organization/namespace for Helm charts"
    required: false
    default: "strimzi-helm"
  registryUser:
    description: "Container registry username"
    required: true
  registryPassword:
    description: "Container registry password"
    required: true
outputs:
  image:
    description: "Full OCI image reference with digest (e.g. quay.io/strimzi-helm/chart@sha256:abc)"
    value: ${{ steps.helm-push.outputs.image }}

runs:
  using: "composite"
  steps:
    - name: Download release artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-${{ inputs.artifactSuffix }}-${{ inputs.releaseVersion }}.tar
        path: ./

    - name: Extract release artifacts
      shell: bash
      run: tar -xvf release-${INPUTS_ARTIFACTSUFFIX}-${INPUTS_RELEASEVERSION}.tar
      env:
        INPUTS_ARTIFACTSUFFIX: ${{ inputs.artifactSuffix }}
        INPUTS_RELEASEVERSION: ${{ inputs.releaseVersion }}

    - name: Login to OCI registry
      shell: bash
      run: helm registry login -u ${INPUTS_REGISTRYUSER} -p ${INPUTS_REGISTRYPASSWORD} ${INPUTS_CONTAINERREGISTRY}
      env:
        INPUTS_REGISTRYUSER: ${{ inputs.registryUser }}
        INPUTS_REGISTRYPASSWORD: ${{ inputs.registryPassword }}
        INPUTS_CONTAINERREGISTRY: ${{ inputs.containerRegistry }}

    - name: Push Helm Chart to OCI registry
      id: helm-push
      shell: bash
      run: |
        PUSH_OUTPUT=$(helm push ${INPUTS_HELMCHARTNAME}-${INPUTS_RELEASEVERSION}.tgz oci://${INPUTS_CONTAINERREGISTRY}/${INPUTS_CONTAINERORG} 2>&1)
        echo "$PUSH_OUTPUT"
        DIGEST=$(echo "$PUSH_OUTPUT" | grep "Digest:" | awk '{print $2}')
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        echo "image=${INPUTS_CONTAINERREGISTRY}/${INPUTS_CONTAINERORG}/${INPUTS_HELMCHARTNAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
      env:
        INPUTS_HELMCHARTNAME: ${{ inputs.helmChartName }}
        INPUTS_RELEASEVERSION: ${{ inputs.releaseVersion }}
        INPUTS_CONTAINERREGISTRY: ${{ inputs.containerRegistry }}
        INPUTS_CONTAINERORG: ${{ inputs.containerOrg }}
