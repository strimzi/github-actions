name: "Setup Minikube"
description: "Installs minikube and configures cluster"

inputs:
  kubeVersion:
    description: "Kubernetes CLI version to install"
    required: false
    default: "v1.37.2"
  minikubeVersion:
    description: "Minikube version to install"
    required: false
    default: "v1.37.2"
  architecture:
    description: "Architecture"
    required: false
    default: "amd64"
  registry:
    description: "Image used for Minikube Registry"
    required: false
    default: mirror.gcr.io/registry:3.1.2

runs:
  using: "composite"
  steps:
    - name: Cache registry Docker image
      id: cache-registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/registry-image.tar
        key: registry-image

    - name: Load registry Docker image from cache
      if: steps.cache-registry.outputs.cache-hit == 'true'
      shell: bash
      run: |
        docker load -i /tmp/registry-image.tar

    - name: Pull and save registry Docker image if cache miss
      if: steps.cache-registry.outputs.cache-hit != 'true'
      shell: bash
      run: |
        docker pull ${INPUTS_REGISTRY}
        docker save ${INPUTS_REGISTRY} -o /tmp/registry-image.tar
      env:
        INPUTS_REGISTRY: ${{ inputs.registry }}

    - name: Setup Minikube
      shell: bash
      run: |
        ${{ github.action_path }}/setup-minikube.sh "${INPUTS_ARCHITECTURE}"

      env:
        TEST_CLUSTER: minikube
        TEST_KUBECTL_VERSION: ${{ inputs.kubeVersion }}
        KUBE_VERSION: ${{ inputs.kubeVersion }}
        TEST_MINIKUBE_VERSION: ${{ inputs.minikubeVersion }}
        REGISTRY_IMAGE: ${{ inputs.registry }}
        RETRIES: ${{ inputs.retries }}
        INPUTS_ARCHITECTURE: ${{ inputs.architecture }}

    - name: Set DOCKER_REGISTRY
      shell: bash
      run: |
        echo "DOCKER_REGISTRY=localhost:5000" >> $GITHUB_ENV

    # This is used for building connect image used withing STs for runs where already existing images are used (releases)
    - name: Set CONNECT_BUILD_REGISTRY
      shell: bash
      # Exporting the registry address to the calling job is the purpose of this step;
      # the value comes from the runner or cluster, not from user input
      run: | # zizmor: ignore[github-env]
        echo "CONNECT_BUILD_REGISTRY=$(kubectl get service registry -n kube-system -o=jsonpath='{.spec.clusterIP}'):80" >> $GITHUB_ENV

    - name: DEBUG - check running containers
      shell: bash
      run: |
        docker ps -a
