name: "Release Artifacts"
description: "Build release artifacts using Makefile and optionally deploy to Maven Central"

inputs:
  releaseVersion:
    description: "Release version (e.g., 1.5.0)"
    required: true
  artifactSuffix:
    description: "Suffix of archive with images"
    required: true
runs:
  using: "composite"
  steps:
    - name: Restore Maven cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-

    - name: Build release artifacts
      shell: bash
      run: make release
      env:
        RELEASE_VERSION: ${{ inputs.releaseVersion }}
        MVN_ARGS: '-B -DskipTests'

    - name: Create release tarball
      shell: bash
      run: |
        find . -type f \( -iname "*${INPUTS_RELEASEVERSION}*.tar.gz" -o \
                          -iname "*${INPUTS_RELEASEVERSION}*.zip" -o \
                          -iname "*${INPUTS_RELEASEVERSION}*.tgz" -o \
                          -iname "*${INPUTS_RELEASEVERSION}*.yaml" \) \
          -exec tar -rvf release-${INPUTS_ARTIFACTSUFFIX}-${INPUTS_RELEASEVERSION}.tar {} \;
      env:
        INPUTS_RELEASEVERSION: ${{ inputs.releaseVersion }}
        INPUTS_ARTIFACTSUFFIX: ${{ inputs.artifactSuffix }}

    - name: Upload release artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-${{ inputs.artifactSuffix }}-${{ inputs.releaseVersion }}.tar
        path: release-${{ inputs.artifactSuffix }}-${{ inputs.releaseVersion }}.tar
        retention-days: 30
