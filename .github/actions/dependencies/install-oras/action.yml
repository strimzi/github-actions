name: "Install ORAS"
description: "Install ORAS CLI for pushing and pulling OCI artifacts"

inputs:
  version:
    description: "ORAS version"
    required: false
    default: "1.3.6"

runs:
  using: "composite"
  steps:
    - name: Install ORAS
      uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      with:
        version: ${{ inputs.version }}
