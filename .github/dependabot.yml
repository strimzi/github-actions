version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflows are loaded automatically when / is specified in the directories list
    directories:
      - "/"
      - "/.github/actions/build/*"
      - "/.github/actions/dependencies/*"
      - "/.github/actions/security/*"
      - "/.github/actions/utils/*"
    schedule:
      interval: "weekly"
    # Wait a week after a release so a compromised version is likely caught before we pick it up
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/configs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
