name: "Snyk Container Scan"
description: "Download container archive, discover images, and run Snyk container scan on each with CVSS threshold check"

inputs:
  containerArtifact:
    description: "Name of the container archive artifact to download"
    required: true
  cvssThreshold:
    description: "Fail if any CVE has CVSS score above this value"
    required: false
    default: "8.0"
  monitor:
    description: "Whether to also run 'snyk container monitor'"
    required: false
    default: "false"
  projectPrefix:
    description: "Project prefix for Snyk dashboard and SARIF artifact naming (e.g., 'strimzi')"
    required: true
  runId:
    description: "Workflow run ID to download the container artifact from"
    required: true

outputs:
  images:
    description: "JSON array of scanned image names (for matrix upload)"
    value: ${{ steps.prepare-sarif.outputs.images }}

runs:
  using: "composite"
  steps:
    - name: Setup Snyk CLI
      uses: snyk/actions/setup@master

    - name: Download container artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.containerArtifact }}
        run-id: ${{ inputs.runId }}
        github-token: ${{ github.token }}

    - name: Untar container archive
      shell: bash
      run: |
        tar -xvf ${{ inputs.containerArtifact }}

    - name: Scan container images
      shell: bash
      env:
        CVSS_THRESHOLD: ${{ inputs.cvssThreshold }}
        MONITOR: ${{ inputs.monitor }}
      run: |
        FAILED=0
        SCANNED=0

        for archive in $(find . -name "*.tar.gz" -type f); do
          IMAGE_NAME=$(basename "$archive" .tar.gz)

          echo "=========================================="
          echo "Scanning image: $IMAGE_NAME"
          echo "=========================================="

          LOAD_OUTPUT=$(docker load < "$archive")
          echo "$LOAD_OUTPUT"
          LOADED_IMAGE=$(echo "$LOAD_OUTPUT" | grep "Loaded image" | sed 's/Loaded image: //')

          if [ -z "$LOADED_IMAGE" ]; then
            echo "::warning::Could not determine loaded image tag for $IMAGE_NAME, skipping"
            continue
          fi

          SARIF_FILE="snyk-container-${IMAGE_NAME}.sarif"
          JSON_FILE="snyk-container-${IMAGE_NAME}.json"

          snyk container test "$LOADED_IMAGE" \
            --sarif-file-output="$SARIF_FILE" \
            --json-file-output="$JSON_FILE" || true

          if [ "$MONITOR" = "true" ]; then
            MONITOR_PROJECT="${LOADED_IMAGE%%:*}"
            MONITOR_REVISION="${LOADED_IMAGE##*:}"
            snyk container monitor "$LOADED_IMAGE" \
              --project-name="$MONITOR_PROJECT" \
              --target-reference="$MONITOR_REVISION" || true
          fi

          if [ -f "$JSON_FILE" ]; then
            COUNT=$(jq --argjson t "$CVSS_THRESHOLD" '
              if type == "array" then
                [.[].vulnerabilities[]? | select(.cvssScore > $t)] | length
              else
                [.vulnerabilities[]? | select(.cvssScore > $t)] | length
              end' "$JSON_FILE")
            if [ "$COUNT" -gt 0 ]; then
              echo "::error::Image $IMAGE_NAME has $COUNT vulnerabilities with CVSS score > $CVSS_THRESHOLD"
              FAILED=$((FAILED + 1))
            fi
          fi

          SCANNED=$((SCANNED + 1))
        done

        echo "Scanned $SCANNED image(s)"

        if [ "$FAILED" -gt 0 ]; then
          echo "::error::CVSS threshold exceeded for $FAILED image(s)"
          exit 1
        fi

    - name: Prepare SARIF files for upload
      id: prepare-sarif
      shell: bash
      run: |
        IMAGE_LIST="[]"
        for sarif in snyk-container-*.sarif; do
          [ -f "$sarif" ] || continue
          IMAGE_NAME=$(basename "$sarif" .sarif | sed 's/snyk-container-//')

          # Sanitize security-severity values
          jq '(.runs[].tool.driver.rules[]?.properties."security-severity") |=
            if . == null or . == "undefined" or (tostring | test("^[0-9]") | not) then "0.0"
            else .
            end' "$sarif" > "${sarif}.tmp" && mv "${sarif}.tmp" "$sarif"

          # Split multi-run SARIFs into individual files in per-image directories
          mkdir -p "sarif-upload/${IMAGE_NAME}"
          CATEGORY="snyk-container-${IMAGE_NAME}"
          RUN_COUNT=$(jq '.runs | length' "$sarif")

          for i in $(seq 0 $((RUN_COUNT - 1))); do
            jq --argjson idx "$i" --arg cat "${CATEGORY}/${i}" --arg img "$IMAGE_NAME" '
              .runs = [.runs[$idx]
                | .automationDetails.id = $cat
                | .tool.driver.name = (.tool.driver.name + " (" + $img + ")")
              ]
            ' "$sarif" > "sarif-upload/${IMAGE_NAME}/run-${i}.sarif"
          done

          IMAGE_LIST=$(echo "$IMAGE_LIST" | jq -c --arg img "$IMAGE_NAME" '. + [$img]')
          echo "Prepared $RUN_COUNT SARIF run(s) for $IMAGE_NAME"
        done

        echo "images=${IMAGE_LIST}" >> "$GITHUB_OUTPUT"
        echo "Image list: ${IMAGE_LIST}"

    - name: Upload SARIF artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: snyk-container-sarif-${{ inputs.projectPrefix }}
        path: sarif-upload/
        retention-days: 30
