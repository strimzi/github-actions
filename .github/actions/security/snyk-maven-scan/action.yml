name: "Snyk Maven Scan"
description: "Run Snyk scan on Maven dependencies with SARIF upload"

inputs:
  snykMonitor:
    description: "Whether to also run 'snyk monitor'"
    required: false
    default: "false"
  scanName:
    description: "Name used for SARIF file naming, upload category, and tool display name (e.g., 'strimzi')"
    required: true
  uploadToCodeScanning:
    description: "Whether to upload SARIF results to GitHub Code Scanning"
    required: false
    default: "true"
  exclude:
    description: "Comma-separated list of directories to exclude from scanning (e.g., 'mockkube,test')"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Snyk CLI
      uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

    - name: Run Snyk test
      shell: bash
      continue-on-error: true
      run: |
        EXCLUDE_FLAG=""
        if [ -n "${INPUTS_EXCLUDE}" ]; then
          EXCLUDE_FLAG="--exclude=${INPUTS_EXCLUDE}"
        fi
        snyk test \
          --all-projects \
          $EXCLUDE_FLAG \
          --sarif-file-output=snyk-maven-${INPUTS_SCANNAME}.sarif \
          --json-file-output=snyk-results.json
      env:
        INPUTS_EXCLUDE: ${{ inputs.exclude }}
        INPUTS_SCANNAME: ${{ inputs.scanName }}

    # This is used to:
    # - Set severity score to 0.0 for those results that has empty value for it (empty value is not supported by GitHub Code Scanning)
    # - Set tool.driver.name to distinguish between different tools within UI
    # - Assign a unique automationDetails.id to each run so GitHub Code Scanning does not reject
    #   SARIF files where snyk --all-projects emits multiple runs with the same (or missing) category
    - name: Sanitize SARIF security-severity values
      shell: bash
      run: |
        SARIF_FILE="snyk-maven-${INPUTS_SCANNAME}.sarif"
        if [ -f "$SARIF_FILE" ]; then
          jq --arg name "Snyk Maven (${INPUTS_SCANNAME})" --arg category "snyk-maven-${INPUTS_SCANNAME}" '
            (.runs[].tool.driver.name) = $name |
            (.runs[].tool.driver.rules[]?.properties."security-severity") |=
              if . == null or . == "undefined" or (tostring | test("^[0-9]") | not) then "0.0"
              else .
              end |
            .runs = (.runs | to_entries | map(
              .value.automationDetails.id = ($category + "/" + (.key | tostring) + "/") |
              .value
            ))' "$SARIF_FILE" > "${SARIF_FILE}.tmp" && mv "${SARIF_FILE}.tmp" "$SARIF_FILE"
        fi
      env:
        INPUTS_SCANNAME: ${{ inputs.scanName }}

    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      if: ${{ always() && inputs.uploadToCodeScanning == 'true' }}
      with:
        sarif_file: snyk-maven-${{ inputs.scanName }}.sarif
        category: snyk-maven-${{ inputs.scanName }}
        wait-for-processing: true

    - name: Upload SARIF as workflow artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: snyk-maven-${{ inputs.scanName }}.sarif
        path: snyk-maven-${{ inputs.scanName }}.sarif
        retention-days: 30

    # Monitor command is used for upload snapshot of the scan to Snyk App where Snyk will do daily scans and can generate reports
    - name: Run Snyk monitor
      if: ${{ inputs.snykMonitor == 'true' }}
      shell: bash
      continue-on-error: true
      run: |
        EXCLUDE_FLAG=""
        if [ -n "${INPUTS_EXCLUDE}" ]; then
          EXCLUDE_FLAG="--exclude=${INPUTS_EXCLUDE}"
        fi
        snyk monitor --all-projects $EXCLUDE_FLAG --target-reference="${GITHUB_REF_NAME}"
      env:
        INPUTS_EXCLUDE: ${{ inputs.exclude }}
