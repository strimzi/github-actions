name: Lint

on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches:
      - "main"
      - "release-*"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker://rhysd/actionlint:1.7.10
        with:
          args: -color
