name: "Snyk Maven Scan"
description: "Run Snyk scan on Maven dependencies with SARIF upload and CVSS threshold check"

inputs:
  cvssThreshold:
    description: "Fail if any CVE has CVSS score above this value"
    required: false
    default: "8.0"
  monitor:
    description: "Whether to also run 'snyk monitor'"
    required: false
    default: "false"
  projectName:
    description: "Project name for Snyk dashboard (also used to derive SARIF filename and Code Scanning category)"
    required: true
  uploadToCodeScanning:
    description: "Whether to upload SARIF results to GitHub Code Scanning"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Snyk CLI
      uses: snyk/actions/setup@master

    - name: Run Snyk test
      shell: bash
      continue-on-error: true
      run: |
        snyk test \
          --sarif-file-output=snyk-maven-${{ inputs.projectName }}.sarif \
          --json-file-output=snyk-results.json

    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v4
      if: ${{ always() && inputs.uploadToCodeScanning == 'true' }}
      with:
        sarif_file: snyk-maven-${{ inputs.projectName }}.sarif
        category: snyk-maven-${{ inputs.projectName }}
        wait-for-processing: true
        ref: ${{ github.ref }}
        sha: ${{ github.sha }}

    - name: Upload SARIF as workflow artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: snyk-maven-${{ inputs.projectName }}.sarif
        path: snyk-maven-${{ inputs.projectName }}.sarif
        retention-days: 30

    - name: Run Snyk monitor
      if: ${{ inputs.monitor == 'true' }}
      shell: bash
      continue-on-error: true
      run: |
        snyk monitor --project-name=${{ inputs.projectName }}

    - name: Check CVSS threshold
      shell: bash
      run: |
        THRESHOLD=${{ inputs.cvssThreshold }}
        if [ -f snyk-results.json ]; then
          COUNT=$(jq --argjson t "$THRESHOLD" '
            if type == "array" then
              [.[].vulnerabilities[]? | select(.cvssScore > $t)] | length
            else
              [.vulnerabilities[]? | select(.cvssScore > $t)] | length
            end' snyk-results.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Found $COUNT vulnerabilities with CVSS score > $THRESHOLD"
            exit 1
          fi
          echo "No vulnerabilities found with CVSS score > $THRESHOLD"
        else
          echo "No Snyk results file found, skipping CVSS threshold check"
        fi
