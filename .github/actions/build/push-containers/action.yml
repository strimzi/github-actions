name: "Push Containers"
description: "Pushes container images and creates manifests"

inputs:
  architectures:
    description: "Comma-separated list of architectures (e.g., 'amd64,arm64,s390x,ppc64le')"
    required: true
  containerRegistry:
    description: "Container registry (e.g., quay.io, ghcr.io)"
    required: false
    default: "quay.io"
  containerOrg:
    description: "Container organization/namespace"
    required: false
    default: "strimzi"
  containerTag:
    description: "Container image tag"
    required: false
    default: "latest"
  registryUser:
    description: "Container registry username"
    required: true
  registryPassword:
    description: "Container registry password"
    required: true
  buildRunId:
    description: "Build workflow run ID for artifact download"
    required: false
    default: ""
  artifactSuffix:
    description: "Suffix of archive with images"
    required: true

outputs:
  images:
    description: "JSON array of {name, digest, sbom} for multi-image attestation via reusable-attest.yml"
    value: ${{ steps.discover-images.outputs.images }}
  sbomsArtifact:
    description: "Name of the uploaded SBOMs artifact"
    value: SBOMs-${{ inputs.artifactSuffix }}-${{ inputs.containerTag }}.tar.gz

runs:
  using: "composite"
  steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Download container artifact
      if: ${{ inputs.buildRunId != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: containers-${{ inputs.artifactSuffix }}*
        path: ./
        merge-multiple: true
        run-id: ${{ inputs.buildRunId }}
        github-token: ${{ github.token }}

    - name: Download container artifact
      if: ${{ inputs.buildRunId == '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: containers-${{ inputs.artifactSuffix }}*
        path: ./
        merge-multiple: true

    - name: Extract container archives
      shell: bash
      run: |
        IFS=',' read -ra ARCH_ARRAY <<< "${{ inputs.architectures }}"
        for arch in "${ARCH_ARRAY[@]}"; do
          tar -xvf "containers-${{ inputs.artifactSuffix }}-${arch}.tar"
          rm "containers-${{ inputs.artifactSuffix }}-${arch}.tar"
        done

    - name: Login to container registry
      shell: bash
      run: docker login -u ${{ inputs.registryUser }} -p ${{ inputs.registryPassword }} ${{ inputs.containerRegistry }}

    - name: Push containers and create manifests
      shell: bash
      run: |
        IFS=',' read -ra ARCH_ARRAY <<< "${{ inputs.architectures }}"
        for arch in "${ARCH_ARRAY[@]}"; do
          echo "Processing architecture: ${arch}"
          export DOCKER_ARCHITECTURE="${arch}"
          make docker_load docker_tag docker_push docker_delete_archive
        done
      env:
        BUILD_REASON: "IndividualCI"
        BRANCH: ${{ github.ref }}
        DOCKER_REGISTRY: ${{ inputs.containerRegistry }}
        DOCKER_ORG: ${{ inputs.containerOrg }}
        DOCKER_TAG: ${{ inputs.containerTag }}

    - name: Create multi-platform manifests
      shell: bash
      run: make docker_amend_manifest
      env:
        BUILD_REASON: "IndividualCI"
        BRANCH: ${{ github.ref }}
        MANIFEST_ARCHITECTURES: ${{ inputs.architectures }}
        DOCKER_REGISTRY: ${{ inputs.containerRegistry }}
        DOCKER_ORG: ${{ inputs.containerOrg }}
        DOCKER_TAG: ${{ inputs.containerTag }}

    - name: Sign container manifests
      # This condition is required for properly running the tests
      # The keyless signing doesn't work on pull_requests events so this part will be tested only during push events
      # It shouldn't affect the usage in Strimzi projects as images are always pushed and signed during push or workflow_dispatch events
      if: ${{ github.event_name != 'pull_request' }}
      shell: bash
      run: make docker_gha_sign_manifest
      env:
        BUILD_REASON: "IndividualCI"
        BRANCH: ${{ github.ref }}
        BUILD_ID: ${{ github.run_number }}
        BUILD_COMMIT: ${{ github.sha }}
        DOCKER_REGISTRY: ${{ inputs.containerRegistry }}
        DOCKER_ORG: ${{ inputs.containerOrg }}
        DOCKER_TAG: ${{ inputs.containerTag }}

    - name: Generate and sign SBOMs
      # This condition is required for properly running the tests
      # The keyless signing doesn't work on pull_requests events so this part will be tested only during push events
      # It shouldn't affect the usage in Strimzi projects as images are always pushed and signed during push or workflow_dispatch events
      if: ${{ github.event_name != 'pull_request' }}
      shell: bash
      run: |
        IFS=',' read -ra ARCH_ARRAY <<< "${{ inputs.architectures }}"
        for arch in "${ARCH_ARRAY[@]}"; do
          echo "Generating SBOM for architecture: ${arch}"
          export DOCKER_ARCHITECTURE="${arch}"
          make docker_gha_sbom
        done
      env:
        BUILD_REASON: "IndividualCI"
        BRANCH: ${{ github.ref }}
        DOCKER_REGISTRY: ${{ inputs.containerRegistry }}
        DOCKER_ORG: ${{ inputs.containerOrg }}
        DOCKER_TAG: ${{ inputs.containerTag }}

    # Generates a list of images and it's digest for attestation
    - name: Discover container images for attestation
      id: discover-images
      shell: bash
      run: |
        images="[]"
        if [ -d "./sbom" ]; then
          for sbom_file in $(find ./sbom -name "*.json" -type f | sort); do
            relative="${sbom_file#./sbom/}"
            after_org="${relative#*${{ inputs.containerRegistry }}/${{ inputs.containerOrg }}/}"
            name="${{ inputs.containerRegistry }}/${{ inputs.containerOrg }}/${after_org%%/*}"
            digest=$(basename "$sbom_file" .json)
            images=$(echo "$images" | jq -c --arg n "$name" --arg d "$digest" --arg s "$relative" \
              '. + [{"name": $n, "digest": $d, "sbom": $s}]')
            echo "Found image: ${name} @ ${digest} (${relative})"
          done
        fi
        echo "images=${images}" >> "$GITHUB_OUTPUT"
        echo "Discovered $(echo "$images" | jq 'length') image(s) for attestation"

    - name: Create SBOM archive
      # This condition is required for properly running the tests
      # The keyless signing doesn't work on pull_requests events so this part will be tested only during push events
      # It shouldn't affect the usage in Strimzi projects as images are always pushed and signed during push or workflow_dispatch events
      if: ${{ github.event_name != 'pull_request' }}
      shell: bash
      run: tar -z -C ./sbom/ -cvpf sbom.tar.gz ./

    - name: Upload SBOM artifact
      # This condition is required for properly running the tests
      # The keyless signing doesn't work on pull_requests events so this part will be tested only during push events
      # It shouldn't affect the usage in Strimzi projects as images are always pushed and signed during push or workflow_dispatch events
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SBOMs-${{ inputs.artifactSuffix }}-${{ inputs.containerTag }}.tar.gz
        path: sbom.tar.gz

    - name: Push SBOMs to registry
      if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
      shell: bash
      run: |
        IFS=',' read -ra ARCH_ARRAY <<< "${{ inputs.architectures }}"
        for arch in "${ARCH_ARRAY[@]}"; do
          echo "Pushing SBOM for architecture: ${arch}"
          export DOCKER_ARCHITECTURE="${arch}"
          make docker_gha_push_sbom
        done
      env:
        BUILD_REASON: "IndividualCI"
        BRANCH: ${{ github.ref }}
        BUILD_ID: ${{ github.run_number }}
        BUILD_COMMIT: ${{ github.sha }}
        DOCKER_REGISTRY: ${{ inputs.containerRegistry }}
        DOCKER_ORG: ${{ inputs.containerOrg }}
        DOCKER_TAG: ${{ inputs.containerTag }}